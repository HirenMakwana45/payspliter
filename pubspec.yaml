name: payspliter
description: "payspliter"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev



environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_mobx: ^2.2.1+1
  mobx: ^2.6.0
  build_runner: ^2.4.13
  mobx_codegen: ^2.6.2
  image: ^4.3.0
  fluttertoast: ^9.1.0
  intl: ^0.20.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  country_code_picker: ^3.1.0
  http: ^1.6.0
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400

        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

